; Configuration PHP pour Domini
; Ce fichier configure PHP pour un hébergement mutualisé

; Limites de mémoire et d'exécution
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Upload de fichiers (pour logos, images de plats, etc.)
upload_max_filesize = 10M
post_max_size = 12M
file_uploads = On

; Gestion des erreurs (PRODUCTION)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Session
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1

; Sécurité
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; Timezone
date.timezone = "Africa/Abidjan"
